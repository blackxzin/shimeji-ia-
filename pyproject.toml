[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shimeji-ia"
version = "2.0.0"
description = "Assistente de desktop evolutiva com IA, voz e visão de tela"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10.0",
    "psutil>=5.9",
    "pyttsx3>=2.90",
    "SpeechRecognition>=3.10",
    "groq>=0.11",
]

[project.optional-dependencies]
mic = ["PyAudio>=0.2.13"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
shimeji = "shimeji.app:main"

[tool.setuptools.packages.find]
include = ["shimeji*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["shimeji"]
omit = ["shimeji/__main__.py"]

[tool.coverage.report]
skip_empty = true
exclude_lines = ["pragma: no cover", "if __name__", "raise NotImplementedError"]
